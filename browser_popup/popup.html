<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../themes.css" />
        <link rel="stylesheet" href="../common.css" />
        <style>
            body {
                min-width: min-content;
                margin: 0;
                padding: 0;
            }
            article {
                display: flex;
                flex-direction: column;
                min-width: 300px;
                max-width: 360px;
                padding: 0;
            }

            /* Header */
            .popup-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 16px 8px;
                border-bottom: 1px solid var(--md-sys-color-outline-variant, #e0e0e0);
            }
            .popup-header h1 {
                font-size: 15px;
                font-weight: 600;
                margin: 0;
                color: var(--md-sys-color-on-surface);
                letter-spacing: -0.2px;
            }
            #settings-link {
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 16px;
                background: var(--md-sys-color-surface-container, #f0f0f0);
                color: var(--md-sys-color-on-surface-variant);
                box-shadow: none;
                font-weight: 500;
            }
            #settings-link:hover {
                background: var(--md-sys-color-surface-container-high, #e4e4e4);
            }
            #settings-link::after { content: ''; }

            /* Content area */
            .popup-body {
                padding: 12px 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            /* Stats — P0: single progress bar replaces 3 boxes */
            #stats-section {
                background: var(--md-sys-color-surface-container, rgba(0,0,0,0.03));
                border-radius: 12px;
                padding: 12px 14px;
                border: none;
            }
            .stats-header {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--md-sys-color-on-surface-variant);
                margin-bottom: 8px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .stats-header span:last-child { font-variant-numeric: tabular-nums; }
            .progress-track {
                height: 8px;
                background: var(--md-sys-color-surface, #fff);
                border-radius: 999px;
                overflow: hidden;
                display: flex;
            }
            .progress-fill-known { background: #1e8e3e; transition: width 0.4s cubic-bezier(0.2,0,0,1); }
            .progress-fill-unknown { background: var(--md-sys-color-error, #d93025); transition: width 0.4s cubic-bezier(0.2,0,0,1); }
            .progress-legend {
                display: flex;
                gap: 12px;
                margin-top: 8px;
                font-size: 11px;
                color: var(--md-sys-color-on-surface-variant);
            }
            .progress-legend b { color: var(--md-sys-color-on-surface); font-weight: 700; }
            .progress-legend .dot { width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:4px; }
            /* legacy grid kept hidden for compat */
            .stats-grid { display: none; }
            .stat-item { display: none; }

            /* Action buttons row */
            .word-actions-row {
                display: flex;
                gap: 8px;
            }
            .word-actions-row button {
                flex: 1;
                font-size: 13px;
                padding: 8px 12px;
                border-radius: 10px;
                font-weight: 500;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
            }
            #review-words-btn {
                background: var(--md-sys-color-primary);
                color: var(--md-sys-color-on-primary);
            }
            #export-words-btn {
                background: var(--md-sys-color-surface-container, #f0f0f0);
                color: var(--md-sys-color-on-surface);
                box-shadow: none;
                border: 1px solid var(--md-sys-color-outline-variant, #ddd);
            }
            #export-words-btn:hover {
                background: var(--md-sys-color-surface-container-high, #e4e4e4);
            }

            #action-progress {
                font-size: 12px;
                color: var(--md-sys-color-on-surface-variant);
                text-align: center;
            }

            /* Parse section */
            .parse-label {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--md-sys-color-on-surface-variant);
                margin: 4px 0 2px;
            }
            .popup-body button:not(.word-actions-row button):not(.fc-nav button) {
                font-size: 13px;
                border-radius: 10px;
                padding: 8px 14px;
            }

            /* ─── Flashcard review ─── */
            #flashcard-section {
                padding: 12px 16px;
            }
            .fc-nav {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 10px;
            }
            .fc-nav button {
                font-size: 12px;
                padding: 5px 12px;
                border-radius: 8px;
                background: var(--md-sys-color-surface-container, #f0f0f0);
                color: var(--md-sys-color-on-surface);
                box-shadow: none;
                border: 1px solid var(--md-sys-color-outline-variant, #ddd);
            }
            .fc-nav button:hover {
                background: var(--md-sys-color-surface-container-high, #e4e4e4);
            }
            .fc-nav-group {
                display: flex;
                gap: 4px;
            }
            #flashcard-counter {
                font-size: 12px;
                color: var(--md-sys-color-on-surface-variant);
                font-weight: 600;
                font-variant-numeric: tabular-nums;
            }

            .flashcard {
                background: var(--md-sys-color-surface-container, #f8f9fa);
                border: 1px solid var(--md-sys-color-outline-variant, #e0e0e0);
                border-radius: 16px;
                padding: 24px 20px;
                text-align: center;
                cursor: pointer;
                min-height: 100px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                transition: box-shadow 0.2s, transform 0.15s;
                user-select: none;
            }
            .flashcard:hover {
                box-shadow: 0 4px 16px rgba(0,0,0,0.08);
                transform: translateY(-1px);
            }
            .flashcard:active {
                transform: translateY(0);
                box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            }
            .fc-word {
                font-size: 2.2em;
                font-weight: 700;
                font-family: 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', sans-serif;
                color: var(--md-sys-color-on-surface);
                line-height: 1.3;
            }
            .fc-divider {
                width: 48px;
                height: 2px;
                background: var(--md-sys-color-primary, #1967d2);
                border-radius: 1px;
                margin: 10px 0;
                opacity: 0.6;
            }
            .fc-reading {
                font-size: 1.15em;
                color: var(--md-sys-color-primary, #1967d2);
                font-weight: 500;
                margin-bottom: 6px;
            }
            .fc-meaning {
                font-size: 0.9em;
                color: var(--md-sys-color-on-surface-variant, #555);
                line-height: 1.5;
                max-width: 260px;
            }
            .fc-sentence {
                font-size: 0.78em;
                color: var(--md-sys-color-on-surface-variant, #777);
                margin-top: 10px;
                padding-top: 8px;
                border-top: 1px solid var(--md-sys-color-outline-variant, #eee);
                line-height: 1.4;
                max-width: 260px;
            }
            .fc-tap-hint {
                font-size: 11px;
                color: var(--md-sys-color-on-surface-variant, #aaa);
                margin-top: 6px;
                opacity: 0.7;
            }

            /* Flashcard reveal animation */
            .flashcard .fc-divider,
            .flashcard .fc-reading,
            .flashcard .fc-meaning,
            .flashcard .fc-sentence {
                animation: fc-reveal 0.3s ease-out both;
            }
            .flashcard .fc-divider  { animation-delay: 0s; }
            .flashcard .fc-reading  { animation-delay: 0.05s; }
            .flashcard .fc-meaning  { animation-delay: 0.1s; }
            .flashcard .fc-sentence { animation-delay: 0.15s; }
            @keyframes fc-reveal {
                from { opacity: 0; transform: translateY(6px); }
                to   { opacity: 1; transform: translateY(0); }
            }

            /* Focus indicators */
            button:focus-visible, a:focus-visible {
                outline: 2px solid var(--md-sys-color-primary, #1967d2);
                outline-offset: 2px;
            }
            .fc-hint {
                text-align: center;
                font-size: 11px;
                color: var(--md-sys-color-on-surface-variant, #999);
                margin-top: 8px;
            }
        </style>
    </head>
    <body>
        <article>
            <div id="main-content">
                <div class="popup-header">
                    <h1>JPDBreader</h1>
                    <a id="settings-link" class="button" target="_blank" href="../settings_page/settings.html">⚙ Settings</a>
                </div>

                <div class="popup-body">
                    <section id="stats-section" style="display:none;">
                        <div class="stats-header"><span>Page Stats</span><span id="stats-pct">—</span></div>
                        <div class="progress-track" aria-hidden="true">
                            <div id="progress-known" class="progress-fill-known" style="width:0%"></div>
                            <div id="progress-unknown" class="progress-fill-unknown" style="width:0%"></div>
                        </div>
                        <div class="progress-legend">
                            <span><i class="dot" style="background:#1e8e3e"></i><b id="stat-known">—</b> known</span>
                            <span><i class="dot" style="background:var(--md-sys-color-error,#d93025)"></i><b id="stat-unknown">—</b> unknown</span>
                            <span style="margin-left:auto"><b id="stat-total">—</b> total</span>
                        </div>
                        <!-- legacy grid for fallback -->
                        <div class="stats-grid" aria-hidden="true"></div>
                    </section>

                    <div id="word-actions" class="word-actions-row" style="display:none;">
                        <button id="review-words-btn">Review</button>
                        <button id="export-words-btn">Export</button>
                    </div>
                    <span id="action-progress" style="display:none;"></span>

                    <div id="primary-parse-wrap" style="display:flex;flex-direction:column;gap:8px;">
                        <div class="parse-label" id="parse-label">Parse this page</div>
                        <div id="parse-buttons"></div>
                        <div id="empty-hint" style="display:none;font-size:11px;color:var(--md-sys-color-on-surface-variant);line-height:1.4;background:var(--md-sys-color-surface-container);padding:8px 10px;border-radius:8px;">No Japanese detected yet. Click Parse to analyze this page, or paste a JPDB token in Settings first.</div>
                    </div>
                </div>
            </div>

            <div id="flashcard-section" style="display:none;">
                <div class="fc-nav">
                    <button id="fc-exit">✕ Back</button>
                    <span id="flashcard-counter">1 / 1</span>
                    <div class="fc-nav-group">
                        <button id="fc-prev">←</button>
                        <button id="fc-next">→</button>
                    </div>
                </div>
                <div id="flashcard-container"></div>
                <div class="fc-hint">Tap card to reveal · ← → to navigate · Esc to exit</div>
            </div>
        </article>
        <script type="module" src="popup.js"></script>
    </body>
</html>
