<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../themes.css" />
        <link rel="stylesheet" href="../common.css" />
        <style>
            body {
                margin: 0;
                width: 350px;
                overflow-x: hidden;
            }

            .popup-wrapper {
                display: flex;
                flex-direction: column;
            }

            /* Accent bar */
            .accent-bar {
                height: 4px;
                background: linear-gradient(90deg, var(--md-sys-color-primary), var(--md-sys-color-primary-container));
                flex-shrink: 0;
            }

            .popup-header {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 14px 16px 10px;
            }

            .popup-header .logo {
                width: 28px;
                height: 28px;
                border-radius: var(--border-radius-sm);
                background: var(--md-sys-color-primary);
                color: var(--md-sys-color-on-primary);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 14px;
                flex-shrink: 0;
            }

            .popup-header .title {
                font-size: 16px;
                font-weight: 600;
                color: var(--color-text);
                letter-spacing: 0.3px;
            }

            .popup-header .subtitle {
                font-size: 11px;
                color: var(--text-color-secondary);
                font-weight: 400;
            }

            .popup-body {
                padding: 0 16px 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            /* Stats card */
            #stats-section {
                display: none;
                background: var(--md-sys-color-surface-container);
                border-radius: var(--border-radius);
                padding: 14px 12px;
                box-shadow: var(--md-sys-elevation-1);
            }

            .stats-label {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                color: var(--text-color-secondary);
                margin-bottom: 10px;
            }

            .stats-grid {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 4px;
                text-align: center;
            }

            .stat-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 6px 4px;
                border-radius: var(--border-radius-sm);
            }

            .stat-item .stat-value {
                font-size: 24px;
                font-weight: 700;
                line-height: 1.1;
                color: var(--color-text);
            }

            .stat-item .stat-label {
                font-size: 11px;
                color: var(--text-color-secondary);
                margin-top: 2px;
            }

            .stat-item.unknown .stat-value {
                color: var(--md-sys-color-warning);
            }

            .stat-item.known .stat-value {
                color: var(--md-sys-color-success);
            }

            /* Mine button */
            #mine-all-btn {
                display: none;
                width: 100%;
                padding: 10px 20px;
                font-size: 14px;
                border-radius: var(--border-radius-pill);
            }

            #mine-progress {
                display: none;
                font-size: 12px;
                color: var(--text-color-secondary);
                text-align: center;
                padding: 0 4px;
            }

            /* Parse section */
            .parse-section-label {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                color: var(--text-color-secondary);
                margin: 4px 0 0;
            }

            #parse-buttons {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            #parse-buttons button {
                width: 100%;
                background: var(--md-sys-color-surface-container);
                color: var(--color-text);
                border: 1px solid var(--md-sys-color-outline-variant);
                border-radius: var(--border-radius-sm);
                padding: 10px 14px;
                font-size: 13px;
                font-weight: 500;
                text-align: left;
                box-shadow: none;
                transition: background-color var(--transition-standard), border-color var(--transition-standard), box-shadow var(--transition-standard);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            #parse-buttons button:hover {
                background: var(--md-sys-color-surface-container-high);
                border-color: var(--md-sys-color-primary);
                box-shadow: var(--md-sys-elevation-1);
                filter: none;
            }

            #parse-buttons button:active {
                transform: translateY(1px);
                box-shadow: none;
            }

            /* Footer */
            .popup-footer {
                display: flex;
                justify-content: center;
                padding: 8px 16px 14px;
                border-top: 1px solid var(--md-sys-color-outline-variant);
            }

            #settings-link {
                font-size: 12px;
                color: var(--text-color-secondary);
                background: none;
                border: none;
                box-shadow: none;
                padding: 4px 8px;
                font-weight: 500;
                border-radius: var(--border-radius-sm);
                transition: color var(--transition-standard), background-color var(--transition-standard);
            }

            #settings-link:hover {
                color: var(--md-sys-color-primary);
                background: var(--md-sys-color-primary-container);
                box-shadow: none;
                filter: none;
                text-decoration: none;
                opacity: 1;
            }

            #settings-link::after {
                content: '';
            }
        </style>
    </head>
    <body>
        <div class="popup-wrapper">
            <div class="accent-bar"></div>

            <header class="popup-header">
                <div class="logo">読</div>
                <div>
                    <div class="title">JPDBreader</div>
                    <div class="subtitle">Japanese reading assistant</div>
                </div>
            </header>

            <main class="popup-body">
                <section id="stats-section">
                    <div class="stats-label">Page Stats</div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-value" id="stat-total">—</span>
                            <span class="stat-label">Total</span>
                        </div>
                        <div class="stat-item unknown">
                            <span class="stat-value" id="stat-unknown">—</span>
                            <span class="stat-label">Unknown</span>
                        </div>
                        <div class="stat-item known">
                            <span class="stat-value" id="stat-known">—</span>
                            <span class="stat-label">Known</span>
                        </div>
                    </div>
                </section>

                <button id="mine-all-btn">Mine all unknown words</button>
                <span id="mine-progress"></span>

                <div class="parse-section-label">Parse open tabs</div>
                <div id="parse-buttons"></div>
            </main>

            <footer class="popup-footer">
                <a id="settings-link" class="button" target="_blank" href="../settings_page/settings.html">⚙ Settings</a>
            </footer>
        </div>
        <script type="module" src="popup.js"></script>
    </body>
</html>
