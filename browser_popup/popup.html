<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../themes.css" />
        <link rel="stylesheet" href="../common.css" />
        <style>
            body {
                min-width: min-content;
                margin: 0;
                padding: 0;
            }
            article {
                display: flex;
                flex-direction: column;
                gap: 0.6em;
                min-width: 22em;
                max-width: 100%;
                align-items: stretch;
                padding: 1em 1.2em;
            }
            /* Accent bar at top */
            article::before {
                content: '';
                display: block;
                height: 3px;
                margin: -1em -1.2em 0.2em;
                background: linear-gradient(90deg, var(--md-sys-color-primary), var(--md-sys-color-primary-container));
                border-radius: 0 0 2px 2px;
            }
            #stats-section {
                border-color: var(--md-sys-color-outline-variant, #ccc) !important;
                background: var(--md-sys-color-surface-container, rgba(0,0,0,0.03));
                border-radius: 8px !important;
                padding: 0.6em 0.8em !important;
            }
            #stats-section strong {
                font-size: 0.8em;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--md-sys-color-on-surface-variant);
            }
            #stat-total, #stat-unknown, #stat-known {
                font-weight: 700;
                font-size: 1.05em;
            }
            #export-words-btn, #review-words-btn {
                font-size: 0.9em;
                border-radius: 8px;
            }
            #action-progress {
                color: var(--md-sys-color-on-surface-variant);
            }
            .word-actions-row {
                display: flex;
                gap: 0.4em;
            }
            .word-actions-row button {
                flex: 1;
            }
            /* Flashcard styles */
            #flashcard-section {
                padding: 0.8em;
            }
            .flashcard {
                background: var(--md-sys-color-surface-container, #f5f5f5);
                border: 1px solid var(--md-sys-color-outline-variant, #ddd);
                border-radius: 12px;
                padding: 1.2em;
                text-align: center;
                cursor: pointer;
                min-height: 80px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                transition: box-shadow 0.15s;
                user-select: none;
            }
            .flashcard:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
            .fc-word {
                font-size: 2em;
                font-weight: 700;
                font-family: 'Noto Sans JP', 'Yu Gothic', sans-serif;
                margin-bottom: 0.2em;
            }
            .fc-divider {
                width: 40%;
                height: 1px;
                background: var(--md-sys-color-outline-variant, #ccc);
                margin: 0.5em 0;
            }
            .fc-reading {
                font-size: 1.1em;
                color: var(--md-sys-color-primary, #1967d2);
                margin-bottom: 0.3em;
            }
            .fc-meaning {
                font-size: 0.95em;
                color: var(--md-sys-color-on-surface-variant, #555);
                line-height: 1.4;
            }
            .fc-sentence {
                font-size: 0.8em;
                color: var(--md-sys-color-on-surface-variant, #777);
                margin-top: 0.5em;
                font-style: italic;
                border-top: 1px solid var(--md-sys-color-outline-variant, #eee);
                padding-top: 0.4em;
            }
            .fc-nav {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.5em;
                margin-top: 0.6em;
            }
            .fc-nav button {
                padding: 6px 14px;
                border-radius: 8px;
                font-size: 0.85em;
            }
            #flashcard-counter {
                font-size: 0.85em;
                color: var(--md-sys-color-on-surface-variant);
                font-weight: 600;
            }
            .fc-hint {
                text-align: center;
                font-size: 0.75em;
                color: var(--md-sys-color-on-surface-variant, #999);
                margin-top: 0.3em;
            }
            #settings-link {
                font-size: 0.85em;
                opacity: 0.7;
                order: 99;
                align-self: center;
                padding: 4px 12px;
            }
            #settings-link:hover {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <article>
            <div id="main-content">
                <a id="settings-link" class="button" target="_blank" href="../settings_page/settings.html">Settings</a>

                <section id="stats-section" style="display:none; border:1px solid var(--color-border, #ccc); border-radius:6px; padding:0.5em; font-size:0.9em;">
                    <strong>Page Stats</strong>
                    <div style="display:grid; grid-template-columns:1fr auto; gap:0.2em 0.5em;">
                        <span>Total words parsed:</span><span id="stat-total">—</span>
                        <span>Unknown words:</span><span id="stat-unknown">—</span>
                        <span>Known words:</span><span id="stat-known">—</span>
                    </div>
                </section>

                <div id="word-actions" class="word-actions-row" style="display:none;">
                    <button id="review-words-btn">🎴 Review</button>
                    <button id="export-words-btn">📥 Export</button>
                </div>
                <span id="action-progress" style="display:none; font-size:0.85em;"></span>

                <span>Parse currently open tabs:</span>
            </div>

            <div id="flashcard-section" style="display:none;">
                <div class="fc-nav">
                    <button id="fc-exit">✕ Back</button>
                    <span id="flashcard-counter">1 / 1</span>
                    <div>
                        <button id="fc-prev">← Prev</button>
                        <button id="fc-next">Next →</button>
                    </div>
                </div>
                <div id="flashcard-container"></div>
                <div class="fc-hint">Click card or press Space to reveal · Arrow keys to navigate</div>
            </div>
        </article>
        <script type="module" src="popup.js"></script>
    </body>
</html>
